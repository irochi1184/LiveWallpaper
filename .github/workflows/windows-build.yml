name: Windows build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build WinUI solution
        run: dotnet build LiveWallpaper.sln -c Release -p:Platform=x64 -bl:artifacts/build.binlog
      - name: Test settings, clock and native window lifecycle
        run: dotnet run --project tests/LiveWallpaper.Windows.Tests -c Release
      - name: Publish portable x64 app
        run: dotnet publish src/LiveWallpaper.App/LiveWallpaper.App.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o artifacts/LiveWallpaper-win-x64
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: LiveWallpaper-win-x64
          path: artifacts/LiveWallpaper-win-x64/
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: artifacts/*.binlog
